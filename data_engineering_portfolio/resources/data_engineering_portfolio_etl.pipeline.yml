# The main pipeline for data_engineering_portfolio

resources:
  pipelines:
    data_engineering_portfolio_etl:
      name: data_engineering_portfolio_etl
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      root_path: "../src/data_engineering_portfolio_etl"

      libraries:
        - glob:
            include: ../src/data_engineering_portfolio_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
