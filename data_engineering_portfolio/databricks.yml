    mode: development
    default: true
    workspace:
      host: https://adb-7405616116502851.11.azuredatabricks.net
    variables:
      catalog: dbw_data_engineering_portfolio_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405616116502851.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/dabrowskimarcin2001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dabrowskimarcin2001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbw_data_engineering_portfolio_dev
      schema: prod
    permissions:
      - user_name: dabrowskimarcin2001@gmail.com
        level: CAN_MANAGE
